[project]
name = 'northwind-api'
version = '0.1.0'
description = 'API CRUD sobre la base de datos northwind, construida con FastAPI, SQLAlchemy y autenticación JWT.'
requires-python = '>=3.12'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.34',
    'sqlalchemy>=2.0',
    'asyncpg>=0.30',
    'pydantic>=2.9',
    'pydantic-settings>=2.6',
    'pyjwt>=2.9',
    'bcrypt>=4.2',
    'alembic>=1.14',
    'python-multipart>=0.0.12',
]

[project.optional-dependencies]
dev = [
    'ruff>=0.8',
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'httpx>=0.27',
]

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['app*']

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py312'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM']
# B008: Depends(...) en valores por defecto es el patrón idiomático de FastAPI.
ignore = ['E501', 'B008']

[tool.ruff.lint.isort]
known-first-party = ['app']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
